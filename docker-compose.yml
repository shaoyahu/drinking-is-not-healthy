version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: drinking-is-not-healthy:latest
    container_name: drinking-is-not-healthy
    restart: unless-stopped

    # 安全加固:仅监听回环(公网靠外层 nginx 反代,不直接暴露 8080)
    ports:
      - "127.0.0.1:8080:80"

    # 降权运行(nginx alpine 镜像内置 nginx 用户 UID=101)
    user: "101:101"

    # 只读文件系统 + tmpfs 给必要的可写目录(uid=101 让 nginx 用户可直接写)
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,size=32m,mode=0755
      - /var/run:uid=101,gid=101,size=4m,mode=0755
      - /tmp:uid=101,gid=101,size=16m,mode=1777
      - /var/log/nginx:uid=101,gid=101,size=16m,mode=0755

    # 最小 capability
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # 绑定 80 端口需要
      - CHOWN              # 启动时切用户
      - SETUID
      - SETGID
      - DAC_OVERRIDE       # 读 /etc/nginx 等配置文件

    # 禁止容器内提权
    security_opt:
      - no-new-privileges:true

    # 资源限制
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 100

    networks:
      - alcohol-net

networks:
  alcohol-net:
    driver: bridge
