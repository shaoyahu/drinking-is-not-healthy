version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: drinking-is-not-healthy:latest
    container_name: drinking-is-not-healthy
    restart: unless-stopped
    ports:
      - "8080:80"  # 主机端口:容器端口 — 改成 80:80 可直接 80 端口访问
    networks:
      - alcohol-net

networks:
  alcohol-net:
    driver: bridge
